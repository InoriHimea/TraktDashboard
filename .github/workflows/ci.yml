name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    ci:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  run_install: false

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Verify calendar dates in a negative UTC offset
              run: pnpm --filter @trakt-dashboard/web exec vitest run src/pages/__tests__/MovieDetailPage.test.tsx
              env:
                  TZ: America/Los_Angeles

            - name: Run quality gate
              run: pnpm run ci

    e2e:
        runs-on: ubuntu-24.04
        needs: ci
        timeout-minutes: 25
        env:
            PLAYWRIGHT_VERSION: "1.60.0"
            PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:83192064c7510f7ee73dd63dc5f22a5e01a92c81a2e6a9c715d9e3fe55471fd9
            E2E_CONTAINER: playwright-${{ github.run_id }}-${{ github.run_attempt }}
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  run_install: false

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Verify and pull matching browser image
              timeout-minutes: 8
              run: |
                  test "$(node -p "require('@playwright/test/package.json').version")" = "$PLAYWRIGHT_VERSION"
                  docker pull "$PLAYWRIGHT_IMAGE"
                  volumes="$(docker image inspect "$PLAYWRIGHT_IMAGE" --format '{{json .Config.Volumes}}')"
                  test "$volumes" = "null" || test "$volumes" = "{}"

            - name: Build web app
              run: pnpm --filter @trakt-dashboard/web build

            - name: Run E2E tests in preinstalled browser image
              timeout-minutes: 12
              run: |
                  docker run --rm --init --name "$E2E_CONTAINER" \
                    --label "com.trakt-dashboard.e2e=$E2E_CONTAINER" \
                    --user "$(id -u):$(id -g)" --env HOME=/tmp \
                    --cpus 2 --memory 4g --memory-swap 4g --pids-limit 512 \
                    --shm-size 1g --cap-drop ALL --security-opt no-new-privileges \
                    --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
                    --workdir /workspace --env CI=true --env BASE_URL=http://localhost:5173 \
                    "$PLAYWRIGHT_IMAGE" \
                    bash -euc 'export PATH="/tmp/pnpm/bin:$PATH"; npm install --global --prefix /tmp/pnpm pnpm@10.19.0 --ignore-scripts; pnpm test:e2e'

            - name: Clean up this E2E container
              if: always()
              run: |
                  ids="$(docker ps -aq --filter "name=^/$E2E_CONTAINER$" --filter "label=com.trakt-dashboard.e2e=$E2E_CONTAINER")"
                  if [ -n "$ids" ]; then
                    docker rm -f "$ids"
                  fi

            - name: Upload Playwright report
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7

    # PR candidates build without publishing images or starting application services.
    # This is a build gate, not a replacement for isolated runtime acceptance.
    docker-build:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 35
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4

            - name: Verify runtime dependency contracts
              run: python3 -m unittest discover -s scripts/tests -p 'test_runtime_deps.py'

            - name: Build API image (no push)
              timeout-minutes: 15
              run: docker build --progress=plain -t trakt-api:ci-${{ github.run_id }}-${{ github.run_attempt }} -f apps/api/Dockerfile .

            - name: Build Web image (no push)
              timeout-minutes: 15
              run: docker build --progress=plain -t trakt-web:ci-${{ github.run_id }}-${{ github.run_attempt }} -f apps/web/Dockerfile .

    smoke-test:
        # Keep the existing main-branch gate; PRs use the build-only gate above.
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        needs: ci
        # Job-level so every step's `docker compose ...` invocation can interpolate the
        # compose file (POSTGRES_PASSWORD has no default and errors the parse if unset).
        # Previously only the "Start services" step set these, so "Wait for healthy"
        # silently failed docker compose's own required-var check every poll and looped
        # until the outer `timeout 90` killed it — masked until now because the KeyDB
        # image pull below used to fail first and this step was never reached.
        env:
            API_IMAGE: trakt-api:smoke
            WEB_IMAGE: trakt-web:smoke
            POSTGRES_PASSWORD: smoke_ci_password
            TRAKT_CLIENT_ID: smoke_fake_id
            TRAKT_CLIENT_SECRET: smoke_fake_secret
            TMDB_API_KEY: smoke_fake_tmdb_key
            API_SECRET: smoke_fake_api_secret_for_ci_use_only

        steps:
            - uses: actions/checkout@v4

            - name: Build API image
              run: docker build -t trakt-api:smoke -f apps/api/Dockerfile .

            - name: Build Web image
              run: docker build -t trakt-web:smoke -f apps/web/Dockerfile .

            - name: Start services
              run: docker compose up -d

            # `docker compose ps --format json` shape (single array vs NDJSON) varies by the
            # compose CLI version on the runner, which previously broke the jq filter here
            # outright ("Cannot index string with string Health") every single poll. Query
            # each container's health directly via `docker inspect` instead — a plain string
            # per container name, no JSON-shape ambiguity possible.
            - name: Wait for all services to be healthy (max 90s)
              run: |
                  timeout 90 bash -c '
                    until [ "$(docker inspect -f "{{.State.Health.Status}}" trakt-api trakt-db trakt-keydb trakt-web | sort -u)" = "healthy" ]; do
                      echo "Waiting for services..."
                      docker compose ps
                      sleep 5
                    done
                  ' || {
                    echo "::group::docker compose ps"
                    docker compose ps
                    echo "::endgroup::"
                    echo "::group::trakt-web health status"
                    docker inspect --format '{{json .State.Health}}' trakt-web
                    echo "::endgroup::"
                    echo "::group::trakt-web container logs"
                    docker compose logs web
                    echo "::endgroup::"
                    exit 1
                  }

            # index.html's <title> was rebranded to "MediaDash" at some point (manifest.json's
            # PWA name is still "Trakt Dashboard" — an unrelated inconsistency, not this step's
            # concern); this check was never updated and, like the rest of this job, was never
            # actually reached until the earlier fixes in this same investigation.
            - name: Verify nginx serves the SPA
              run: curl -fsSL http://localhost/ | grep -q "MediaDash"

            - name: Verify API health endpoint
              run: curl -fsS http://localhost:3001/health | jq -e '.ok == true'

            - name: Tear down
              if: always()
              run: docker compose down -v

    # N6 batch 2: GitHub is only a mirror (primary remote is self-hosted), so a red
    # Actions run goes unseen unless it is pushed somewhere visible. Requires the
    # GOTIFY_URL / GOTIFY_TOKEN repository secrets; silently no-ops until they exist.
    notify-failure:
        runs-on: ubuntu-latest
        needs: [ci, e2e, docker-build, smoke-test]
        if: failure()
        steps:
            - name: Push failure notification to Gotify
              continue-on-error: true
              env:
                  GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
                  GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
              run: |
                  if [ -z "$GOTIFY_URL" ] || [ -z "$GOTIFY_TOKEN" ]; then
                    echo "Gotify secrets not configured; skipping notification."
                    exit 0
                  fi
                  curl -sf -X POST "$GOTIFY_URL/message?token=$GOTIFY_TOKEN" \
                    -F "title=CI failed: ${{ github.repository }}@${{ github.ref_name }}" \
                    -F "message=Workflow: ${{ github.workflow }}
                  Commit: ${{ github.sha }}
                  Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                    -F "priority=8"
